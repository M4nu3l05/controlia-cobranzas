services:
  postgres-staging:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: controlia_staging
      POSTGRES_USER: controlia_stage
      POSTGRES_PASSWORD: local_staging_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlia_stage -d controlia_staging"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - controlia_staging_data:/var/lib/postgresql/data

volumes:
  controlia_staging_data:
